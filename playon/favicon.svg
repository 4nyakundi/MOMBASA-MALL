<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFEA61" />
      <stop offset="100%" stop-color="#FFD400" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#008740" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Green Outer Circle -->
  <circle cx="50" cy="50" r="46" fill="#00A651" filter="url(#shadow)" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,4" opacity="0.8" />
  
  <!-- Sunshine Yellow Star/Smiley Face -->
  <path d="M50,16 L58,35 L78,36 L62,50 L67,70 L50,58 L33,70 L38,50 L22,36 L42,35 Z" fill="url(#grad)" stroke="#E6BE00" stroke-width="2" />
  
  <!-- Cute Happy Eyes & Big Smile -->
  <circle cx="43" cy="44" r="3.5" fill="#0B1E15" />
  <circle cx="57" cy="44" r="3.5" fill="#0B1E15" />
  <circle cx="42" cy="42.5" r="1.2" fill="#FFFFFF" />
  <circle cx="56" cy="42.5" r="1.2" fill="#FFFFFF" />
  <!-- Cheeks -->
  <circle cx="39" cy="48" r="2.5" fill="#FF4081" opacity="0.7" />
  <circle cx="61" cy="48" r="2.5" fill="#FF4081" opacity="0.7" />
  <!-- Big Grin -->
  <path d="M43,49 Q50,56 57,49" fill="none" stroke="#0B1E15" stroke-width="2.5" stroke-linecap="round" />
</svg>
