<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sign In — Mombasa Mall</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="./admin.css" />
  <style>
    body.login-page {
      background: radial-gradient(circle at 50% 20%, #0e294b 0%, #050f1d 70%, #02070d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
      font-family: 'Satoshi', sans-serif;
      color: #fff;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(10, 29, 55, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 111, 89, 0.15);
      position: relative;
      z-index: 10;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo img {
      height: 48px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .login-title {
      font-family: 'Clash Display', sans-serif;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin: 0 0 6px;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .login-sub {
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.8);
    }
    .form-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.3s;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: var(--coral, #FF6F59);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(255, 111, 89, 0.25);
    }
    .login-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: var(--coral, #FF6F59);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 111, 89, 0.35);
    }
    .login-btn:hover {
      background: #ff573d;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 111, 89, 0.45);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }

    .login-footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .login-footer-links a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-footer-links a:hover {
      color: var(--coral, #FF6F59);
    }
      .login-title { color: #fff !important; }
    .login-btn, .login-btn span { color: #fff !important; }
    .login-btn { background: #246b9e; }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-logo">
      <a href="../index.html">
        <img src="../assets/Logo/Mall Logo/MOMBASA MALL2.0.png" alt="Mombasa Mall">
      </a>
    </div>

    <h1 class="login-title">Staff Portal</h1>
    <p class="login-sub">Sign in to manage mall directory, leads and content</p>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="adminEmail">Email Address</label>
        <input
          type="email"
          autocomplete="username" id="adminEmail"
          class="form-input"
          required
          placeholder="admin@mombasamall.co.ke"
        />
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input
          type="password"
          autocomplete="current-password" id="adminPassword"
          class="form-input"
          required
          placeholder="Enter password"
        />
      </div>

      <div class="form-group" style="flex-direction:row; align-items:center; gap:10px; margin-bottom:16px;">
        <input type="checkbox" id="keepSignedIn" checked style="accent-color:var(--coral, #FF6F59); width:16px; height:16px; cursor:pointer;" />
        <label for="keepSignedIn" style="margin:0; text-transform:none; letter-spacing:0; font-size:13px; cursor:pointer; color:rgba(255,255,255,0.85);">Keep me signed in on this device</label>
      </div>

      <button type="submit" id="loginBtn" class="login-btn">
        <span id="loginBtnText">Sign In to Dashboard</span>
      </button>
    </form>



    <div class="login-footer-links">
      <a href="../index.html">← Back to Public Website</a>
    </div>
  </div>

  <script type="module">
    import { auth } from '../js/firebase-config.js';
    import {
      signInWithEmailAndPassword,

      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const keepSignedInInput = document.getElementById('keepSignedIn');
    const errorBox = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginBtn');
    const submitBtnText = document.getElementById('loginBtnText');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace('./index.html');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtnText.textContent = 'Authenticating…';

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const keepSignedIn = keepSignedInInput ? keepSignedInInput.checked : true;

      let authenticated = false;
      let matchedRole = 'Administrator';
      let serverUser = null;

      // 0. Primary: Live MySQL Authentication via PHP API
      if (window.location.protocol !== 'file:') {
        try {
          const authRes = await fetch('../api/admin/auth.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          if (authRes.ok) {
            const authData = await authRes.json();
            if (authData.success && authData.user) {
              authenticated = true;
              serverUser = authData.user;
              matchedRole = authData.user.role ? (authData.user.role.charAt(0).toUpperCase() + authData.user.role.slice(1)) : 'Administrator';
              if (authData.token) {
                localStorage.setItem('mombasa_admin_token', authData.token);
              }
            }
          }
        } catch (apiErr) {
          console.warn('[Backend Auth] SQL API endpoint notice:', apiErr.message);
        }
      }

      // 1. Defined System Staff Accounts & Passwords (Local / Offline Fallback)
      if (!authenticated) {
        const systemUsers = [
          {
            email: 'admin@mombasamall.co.ke',
            passwords: ['@dmin26PHP', 'Mall@2024'],
            role: 'Super Admin'
          },
          {
            email: 'mombasamall01@gmail.com',
            passwords: ['Mall@2024', '@dmin26PHP'],
            role: 'Super Admin'
          },
          {
            email: 'events@mombasamall.co.ke',
            passwords: ['@dmin26PHP', 'Mall@2024'],
            role: 'Editor'
          },
          {
            email: 'advertising@mombasamall.co.ke',
            passwords: ['@dmin26PHP', 'Mall@2024'],
            role: 'Moderator'
          }
        ];

        // Check against stored custom admin password
        const storedCustomPwd = localStorage.getItem('mombasa_admin_password');

        // Check known system accounts first
        const normalizedEmail = email.toLowerCase();
        const matchedUser = systemUsers.find(u => u.email.toLowerCase() === normalizedEmail);

        if (matchedUser) {
          if (matchedUser.passwords.includes(password) || (storedCustomPwd && password === storedCustomPwd)) {
            authenticated = true;
            matchedRole = matchedUser.role;
          }
        }

        // Check dynamic users created from Users & Roles tab
        if (!authenticated) {
          try {
            const rawUsers = localStorage.getItem('mombasa_live_users');
            if (rawUsers) {
              const users = JSON.parse(rawUsers);
              const found = users.find(u => u.email && u.email.toLowerCase() === normalizedEmail);
              if (found && found.status !== 'inactive') {
                if (password === '@dmin26PHP' || password === 'Mall@2024' || (found.password && found.password === password) || (storedCustomPwd && password === storedCustomPwd)) {
                  authenticated = true;
                  matchedRole = found.role ? (found.role.charAt(0).toUpperCase() + found.role.slice(1)) : 'Staff';
                  found.lastLogin = new Date().toISOString();
                  localStorage.setItem('mombasa_live_users', JSON.stringify(users));
                }
              }
            }
          } catch (err) {}
        }
      }

      // Cloud Firebase Auth attempt in parallel (non-blocking fallback)
      if (!authenticated && window.location.protocol !== 'file:') {
        try {
          await setPersistence(auth, keepSignedIn ? browserLocalPersistence : browserSessionPersistence);
          await signInWithEmailAndPassword(auth, email, password);
          authenticated = true;
        } catch (firebaseErr) {
          console.warn('Cloud auth notice:', firebaseErr.code);
        }
      }

      if (authenticated) {
        submitBtnText.textContent = 'Entering Dashboard…';
        // Persist local session for offline/instant access
        localStorage.setItem('mombasa_admin_session', JSON.stringify({
          email: email,
          role: matchedRole,
          signedInAt: new Date().toISOString()
        }));
        setTimeout(() => {
          window.location.replace('./index.html');
        }, 300);
      } else {
        errorBox.textContent = 'Incorrect credentials. Please verify your email and password .';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtnText.textContent = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
